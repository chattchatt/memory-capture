# ~/.config/memory-capture/config.toml — every key is optional.

# Shared store for feedback/project bodies (+ INDEX.md). Leave empty to keep bodies in
# Claude Code's per-folder memory directly.
# kernel_dir = "~/notes/memory"

# projects_dir = "~/.claude/projects"
# inbox_dir = "~/.claude/memory-inbox"
# min_transcript_bytes = 20000     # skip short sessions
# max_candidates = 5
# capture_reasons = ["clear", "prompt_input_exit", "logout", "other"]
# claude_bin = "claude"
# model = "sonnet"                # model for extraction (default: your Claude Code default)
# extract_timeout_s = 300
# sweep_idle_minutes = 120        # a transcript idle this long without SessionEnd counts as finished
# sweep_lookback_days = 7
# interactive_entrypoints = ["cli"]   # skip `claude -p` (sdk-cli) runs
# retry_after_hours = 6           # failed extractions are retried after this
# max_retry_rounds = 3
# rules_file = "~/.config/memory-capture/rules.md"   # extra extraction rules appended to the prompt
